[workspace]
members = ["starlette-rs", "starlette-rs-py"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.85"
repository = "https://github.com/appunni-m/starlette-rs"

[workspace.dependencies]
base64 = "0.22.1"
encoding_rs = "0.8.35"
futures = "0.3.31"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
multer = "3.1.0"
pyo3 = "0.29.2"
pyo3-build-config = "0.29.2"
# The package dependency is versioned so cargo-deny can reject wildcard paths.
starlette-rs = { path = "starlette-rs", version = "0.1.0" }

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
dead_code = "deny"
# Keep public declarations reachable and their signatures usable downstream.
private_bounds = "deny"
private_interfaces = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "warn"
unsafe_code = "deny"
deprecated = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "warn"
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"
clone_on_copy = "deny"
unnecessary_to_owned = "deny"
needless_borrow = "deny"
map_unwrap_or = "deny"
needless_range_loop = "deny"
unnecessary_cast = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
