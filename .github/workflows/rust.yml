name: Workspace quality and parity gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Hosted runners should not inherit a machine-local compiler wrapper.
  RUSTC_WRAPPER: ""
  # Retry transient registry failures without changing the final build result.
  CARGO_NET_RETRY: "3"

jobs:
  lint-and-check:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.96.1", "1.85.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --component clippy
      - name: Report toolchain versions
        run: |
          rustc +"${{ matrix.toolchain }}" --version
          cargo +"${{ matrix.toolchain }}" --version
          python --version
      - name: Check formatting, lints, and documentation with the pinned current toolchain
        if: matrix.toolchain == '1.96.1'
        env:
          PYO3_PYTHON: python
        run: make CARGO="cargo +${{ matrix.toolchain }}" fmt clippy rustdoc-check
      - name: Check workspace compilation with each supported toolchain
        env:
          PYO3_PYTHON: python
        run: make CARGO="cargo +${{ matrix.toolchain }}" check build

  python-quality:
    name: Python package, style, and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: target
    env:
      STARLETTE_ORACLE_ROOT: ${{ github.workspace }}/starlette
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
      - name: Checkout the pinned Starlette oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kludex/starlette
          ref: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
          path: starlette
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: target/requirements-style.txt
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Create the pinned style-tool environment
        run: make style-setup PYTHON=python
      - name: Check Python style, repository policy, generated parity contract, workflows, and documentation links
        run: make python-format python-lint rust-api-boundary-check project-policy-check workflows-check contract-check docs-check

  python-package-matrix:
    name: CPython ${{ matrix.python-version }} package build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Build and install the source package
        env:
          PYO3_PYTHON: python
          RUSTUP_TOOLCHAIN: 1.96.1
        run: python -m pip install --editable .
      - name: Check installed public package imports
        run: python -c "from starlette.applications import Starlette; from starlette.requests import Request; from starlette.responses import Response; from starlette.websockets import WebSocket; from starlette_rs_py import _core"
      - name: Check installed dependency metadata
        run: python -m pip check

  supply-chain:
    name: Rust dependency security and license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Install pinned supply-chain tools
        run: make supply-chain-tools
      - name: Check advisories, licenses, duplicate versions, and sources
        run: make supply-chain-check

  source-parity:
    name: Pinned Starlette source parity (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: target
    env:
      STARLETTE_ORACLE_ROOT: ${{ github.workspace }}/starlette
      PYO3_PYTHON: python
      RUSTUP_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - name: Checkout pinned Starlette oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kludex/starlette
          ref: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
          path: starlette
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Run source-to-target parity comparisons
        run: make test PARITY_PYTHON=python
      - name: Upload source parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starlette-source-parity-${{ matrix.python-version }}-${{ github.run_id }}
          path: target/build/parity/parity-result.json
          if-no-files-found: warn
          retention-days: 30

  source-parity-coverage:
    name: Coverage (${{ matrix.profile_id }})
    needs: source-parity
    if: needs.source-parity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile_id: rust-native-local
            python-version: "3.12"
            prepare-environment: true
          - profile_id: python-package-cpython310
            python-version: "3.10"
            prepare-environment: true
          - profile_id: python-package-cpython311
            python-version: "3.11"
            prepare-environment: true
          - profile_id: python-package-cpython312
            python-version: "3.12"
            prepare-environment: true
          - profile_id: python-package-cpython313
            python-version: "3.13"
            prepare-environment: true
          - profile_id: python-package-cpython314
            python-version: "3.14"
            prepare-environment: true
    defaults:
      run:
        working-directory: target
    env:
      STARLETTE_ORACLE_ROOT: ${{ github.workspace }}/starlette
      PYO3_PYTHON: python
      RUSTUP_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - name: Checkout pinned Starlette oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kludex/starlette
          ref: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
          path: starlette
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust and its LLVM coverage component
        run: rustup toolchain install 1.96.1 --profile minimal --component llvm-tools-preview
      - name: Verify coverage profile interpreter
        run: python --version
      - name: Prepare the selected Python package parity environment
        if: matrix.prepare-environment
        run: make parity-env PARITY_PYTHON=python
      - name: Install and verify pinned cargo-llvm-cov
        run: make coverage-tools
      - name: Report coverage collector and LLVM tool versions
        run: |
          cargo llvm-cov --version
          rustc --version --verbose
          rustc_host="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/${rustc_host}/bin"
          "${llvm_bin}/llvm-cov" --version
          "${llvm_bin}/llvm-profdata" --version
      - name: Measure the selected target profile
        run: make coverage PARITY_PYTHON=python COVERAGE_TARGET_PROFILE="${{ matrix.profile_id }}"
      - name: Upload selected profile coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starlette-coverage-${{ matrix.profile_id }}-${{ github.run_id }}
          path: target/build/parity/coverage/${{ matrix.profile_id }}/
          if-no-files-found: warn
          retention-days: 30
