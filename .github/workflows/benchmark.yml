name: Pinned Starlette source/package benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: upstream-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: ""
  CARGO_NET_RETRY: "3"
  STARLETTE_ORACLE_ROOT: ${{ github.workspace }}/starlette
  PYO3_PYTHON: python

jobs:
  benchmark:
    name: 74-workload Router/GZip benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pinned Starlette oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kludex/starlette
          ref: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
          path: starlette
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1

      - name: Run correctness-gated upstream benchmark
        run: make benchmark-upstream CARGO="cargo +1.96.1" PARITY_PYTHON=python

      - name: Upload benchmark and correctness-gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starlette-upstream-benchmark-${{ github.run_id }}
          path: |
            build/parity/upstream-benchmark-result.json
            build/parity/upstream-benchmark-correctness-result.json
          if-no-files-found: warn
          retention-days: 30
