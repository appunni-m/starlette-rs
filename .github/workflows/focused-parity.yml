name: Focused Starlette parity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/focused-parity.yml"
      - "starlette-rs-py/src/awaitable.rs"
  workflow_dispatch:
    inputs:
      mode:
        description: Focused parity case or the CPython 3.14 cookie coverage diagnostic
        required: true
        type: choice
        options:
          - parity
          - cookie-coverage-diagnostic
        default: parity
      case_id:
        description: Active parity case ID to run
        required: true
        type: string
        default: starlette.applications.Starlette.__call__.get-hello
      target_ref:
        description: Target repository ref to compare
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: focused-parity-${{ inputs.target_ref || github.sha }}-${{ inputs.mode || 'parity' }}-${{ inputs.case_id || 'starlette.applications.Starlette.__call__.get-hello' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTC_WRAPPER: ""
  CARGO_NET_RETRY: "3"

jobs:
  parity:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'cookie-coverage-diagnostic' }}
    name: ${{ inputs.case_id || 'starlette.applications.Starlette.__call__.get-hello' }} (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: target
    env:
      STARLETTE_ORACLE_ROOT: ${{ github.workspace }}/starlette
      STARLETTE_PARITY_CASE_ID: ${{ inputs.case_id || 'starlette.applications.Starlette.__call__.get-hello' }}
      PYO3_PYTHON: python
      RUSTUP_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          path: target
          persist-credentials: false
      - name: Checkout pinned Starlette oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kludex/starlette
          ref: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
          path: starlette
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Run the selected parity case
        run: >-
          make test PARITY_PYTHON=python
          PARITY_CASE_IDS="$STARLETTE_PARITY_CASE_ID"
          PARITY_RUN_OUTPUT=build/parity/focused-parity-result.json
      - name: Upload selected parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-parity-${{ matrix.python-version }}-${{ github.run_id }}
          path: target/build/parity/focused-parity-result.json
          if-no-files-found: warn
          retention-days: 30

  cookie-coverage-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'cookie-coverage-diagnostic' }}
    name: Cookie callback-error coverage diagnostic (CPython 3.14.8)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: target
    env:
      STARLETTE_ORACLE_ROOT: ${{ github.workspace }}/starlette
      STARLETTE_RS_COOKIE_LIFETIME_DIAGNOSTIC: build/parity/cookie-lifetime-traceback.jsonl
      PYO3_PYTHON: python
      RUSTUP_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          path: target
          persist-credentials: false
      - name: Checkout pinned Starlette oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kludex/starlette
          ref: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
          path: starlette
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.8
      - name: Install Rust and its LLVM coverage component
        run: rustup toolchain install 1.96.1 --profile minimal --component llvm-tools-preview
      - name: Prepare isolated source and target environments
        run: make parity-env PARITY_PYTHON=python
      - name: Run the four cookie callback-error inputs
        run: >-
          make coverage PARITY_PYTHON=python
          COVERAGE_TARGET_PROFILE=python-package-cpython314
          COVERAGE_CASE_IDS='starlette.responses.Response.consumer-construction.cookie-boundary-owned-attribute-callback-error
          starlette.responses.HTMLResponse.consumer-construction.cookie-boundary-owned-attribute-callback-error
          starlette.responses.PlainTextResponse.consumer-construction.cookie-boundary-owned-attribute-callback-error
          starlette.responses.JSONResponse.consumer-construction.cookie-boundary-owned-attribute-callback-error'
      - name: Verify focused selection emitted no full coverage receipt
        run: test -z "$(find build/parity/coverage/python-package-cpython314 -name coverage-receipt.json -type f -print -quit)"
      - name: Upload focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-cookie-coverage-cpython314-${{ github.run_id }}
          path: |
            target/build/parity/coverage/python-package-cpython314/*/coverage-result.json
            target/build/parity/coverage/python-package-cpython314/*/coverage-config.json
            target/build/parity/coverage/python-package-cpython314/*/toolchain.json
            target/build/parity/cookie-lifetime-traceback.jsonl
          if-no-files-found: warn
          retention-days: 30
