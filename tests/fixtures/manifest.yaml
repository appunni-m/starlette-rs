    "mode": "slice",
    "inventory": {
      "authority": "Pinned Starlette 1.6.0 source; this slice defines direct ASGI response, Request/routing, GZipMiddleware and RequestBodyLimitMiddleware, WebSocket route dispatch, raw WebSocket protocol and projected state transitions, typed WebSocket convenience methods and iterator protocol, WebSocketClose framing/attributes, and a public Router route-selection slice over string, int, float, UUID, and path converters, route ordering, and root_path handling. The bounded routing slice also includes a Mount child-scope projection. This slice also ports configuration value lookup and environment mappings, URL query parameter operations, docstring-based schema generation, and OpenAPI response rendering. The bounded Python-package profile also covers SessionMiddleware signed-cookie workflows, cookie attributes and expiry, session mutation flags, Vary-on-access, and clearing. The same workflow also samples the source WebSocket cookie-loading branch and non-HTTP lifespan pass-through. The bounded Python-package profile also covers four BaseHTTPMiddleware behaviors through configured Middleware or a direct ASGI wrapper: response-header mutation, replacement responses, request-body cache/replay, and response completion waking a blocked downstream receive.",
      "revision": "4f250d6b814587e20c5365f0a5f0c4d42bcb929f",
      "command_id": "inventory-slice"
    }
  },
