    "id": "starlette-1.6.0-asgi-http-config-session-slice",
    "mode": "slice",
    "inventory": {
      "authority": "Pinned Starlette 1.6.0 source; this slice defines direct ASGI response, Request/routing, application and route-level body-size limits, exception-handler registration and middleware-stack snapshots, async endpoint loop/task/thread ownership and request-task cancellation, GZipMiddleware and RequestBodyLimitMiddleware, WebSocket route dispatch, raw WebSocket protocol and projected state transitions, typed WebSocket convenience methods and iterator protocol, WebSocketClose framing/attributes, and a public Router route-selection slice over string, int, float, UUID, and path converters, route ordering, and root_path handling. The bounded routing slice also includes a Mount child-scope projection. This slice also ports configuration value lookup and environment mappings, URL scope construction with Host validation, server fallback, authority-in-path protection, and query parameter operations, docstring-based schema generation, and OpenAPI response rendering. The bounded Python-package profile also covers SessionMiddleware signed-cookie workflows, cookie attributes and expiry, session mutation flags, Vary-on-access, and clearing. The same workflow also samples the source WebSocket cookie-loading branch and non-HTTP lifespan pass-through. The bounded Python-package profile also covers BaseHTTPMiddleware request/response workflows through configured Middleware or a direct ASGI wrapper, including response-header mutation, body/stream replay, disconnect and cancellation ordering, exception propagation, and FileResponse pathsend forwarding. The active Python-package profile also compares StaticFiles constructor-time and lazy directory checks, repeated successful configuration checks, and BaseHTTPMiddleware ContextVar propagation across call_next with a pure-ASGI control. The active Python-package profile now also includes one input-driven Jinja2Templates workflow over directory loading, autoescape, context processors, url_for, response metadata, and the ASGI debug extension. The active Python-package profile also covers response-attached BackgroundTask and BackgroundTasks async/sync execution, synchronous callback cancellation while its worker is held for cancellation delivery, sequential task ordering, failure propagation, and callable shape classification for async/sync bound methods, callable objects, partials, and nested partials. The active Python-package profile also includes bounded synchronous TestClient HTTP request/response and WebSocket text/binary exchange and pre-acceptance denial-response slices, plus context-managed lifespan startup/shutdown with timeout deprecation-warning parity; streaming request bodies and remaining error-policy cases are separate compatibility work.",
      "revision": "4f250d6b814587e20c5365f0a5f0c4d42bcb929f",
      "command_id": "inventory-slice"
    }
  },
