              "get": "responses:\n  200:\n    description: Organization list\n",
              "post": "responses:\n  201:\n    description: Organization created\n"
            }
          }
        },
        {
          "kind": "websocket-route",
          "path": "/socket",
          "endpoint": {"kind": "function", "docstring": "responses:\n  200:\n    description: Not an HTTP route\n"}
