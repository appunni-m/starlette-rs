              "endpoint": {
                "kind": "function",
                "docstring": "responses:\n  200:\n    description: Mounted status\n"
              }
            }
          ]
        },
        {
          "kind": "host",
          "host": "api.example.test",
          "routes": [
            {
              "kind": "mount",
              "path": "/tenant",
              "routes": [
                {
                  "kind": "route",
                  "path": "/health",
                  "methods": ["GET"],
                  "endpoint": {
                    "kind": "function",
                    "docstring": "responses:\n  200:\n    description: Host mounted health\n"
                  }
                }
              ]
            }
          ]
        }
      ],
      "observations": ["endpoints", "schema"]
