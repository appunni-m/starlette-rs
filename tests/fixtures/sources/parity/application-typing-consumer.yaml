        "source": "from collections import UserDict\nfrom collections.abc import AsyncIterator, Mapping, MutableMapping\nfrom contextlib import asynccontextmanager\nfrom typing import Any, TypedDict\n\nfrom typing_extensions import assert_type\n\nfrom starlette.applications import Starlette\nfrom starlette.datastructures import Address, FormData, Headers, QueryParams, URL, URLPath\nfrom starlette.middleware.authentication import AuthenticationMiddleware\nfrom starlette.middleware.base import BaseHTTPMiddleware\nfrom starlette.middleware.body_limit import RequestBodyLimitMiddleware\nfrom starlette.middleware.cors import CORSMiddleware\nfrom starlette.middleware.gzip import GZipMiddleware\nfrom starlette.middleware.httpsredirect import HTTPSRedirectMiddleware\nfrom starlette.middleware.sessions import SessionMiddleware\nfrom starlette.middleware.trustedhost import TrustedHostMiddleware\nfrom starlette.middleware.wsgi import WSGIMiddleware\nfrom starlette.requests import HTTPConnection, Request\nfrom starlette.responses import Response\nfrom starlette.routing import BaseRoute, Match, Router\nfrom starlette.staticfiles import StaticFiles\nfrom starlette.testclient import ASGIInstance, TestClient, WebSocketTestSession\nfrom starlette.types import ASGIApp, Message, Receive, Scope, Send\nfrom starlette.websockets import WebSocket, WebSocketClose\n\n\nclass State(TypedDict):\n    user_id: int\n\n\nclass TypedApp(Starlette):\n    pass\n\n\nclass TypedTestClient(TestClient):\n    pass\n\n\nclass TypedWebSocketTestSession(WebSocketTestSession):\n    pass\n\n\nasync def child(scope: Scope, receive: Receive, send: Send) -> None:\n    await send({\"type\": \"http.response.start\", \"status\": 204, \"headers\": []})\n    await send({\"type\": \"http.response.body\", \"body\": b\"\"})\n\n\ndef asgi2_app(scope: Scope) -> ASGIInstance:\n    async def instance(receive: Receive, send: Send) -> None:\n        message = await receive()\n        await send(message)\n\n    return instance\n\n\ndef http_handler(request: Request, exc: Exception) -> Response:\n    return Response(str(request.state[\"user_id\"]))\n\n\ndef testclient_context(client: TypedTestClient) -> TypedTestClient:\n    with client as entered:\n        reveal_type(entered)\n        return entered\n\n\ndef websocket_session_context(session: TypedWebSocketTestSession) -> TypedWebSocketTestSession:\n    with session as entered:\n        reveal_type(entered)\n        return entered\n\n\ndef request_state(request: Request[State]) -> int:\n    return request.state[\"user_id\"]\n\n\ndef websocket_state(websocket: WebSocket[State]) -> int:\n    assert_type(websocket.headers, Headers)\n    send_callback: Send = websocket.send\n    receive_callback: Receive = websocket.receive\n    assert_type(websocket.client, Address | None)\n    assert_type(websocket.query_params, QueryParams)\n    assert_type(websocket.cookies, dict[str, str])\n    assert_type(websocket.url, URL)\n    return websocket.state[\"user_id\"]\n\n\nasync def websocket_convenience_return_types(websocket: WebSocket[State]) -> None:\n    text = await websocket.receive_text()\n    assert_type(text, str)\n    reveal_type(text)\n    data = await websocket.receive_bytes()\n    assert_type(data, bytes)\n    reveal_type(data)\n\n\ndef construct_connections(\n    scope: Scope, receive: Receive, send: Send\n) -> tuple[HTTPConnection[State], Request[State], WebSocket[State]]:\n    return (\n        HTTPConnection(scope, receive),\n        Request(scope, receive, send),\n        WebSocket(scope, receive, send),\n    )\n\n\nasync def call_websocket_close(\n    close: WebSocketClose, scope: Scope, receive: Receive, send: Send\n) -> None:\n    await close(scope, receive, send)\n\n\ndef request_value_contract(request: Request[State]) -> None:\n    assert_type(request.url, URL)\n    assert_type(request.headers, Headers)\n    assert_type(request.client, Address | None)\n    assert_type(request.cookies, dict[str, str])\n    reveal_type(request.cookies)\n    reveal_type(request.stream())\n    reveal_type(request.form())\n    assert_type(request.receive, Receive)\n    reveal_type(request.receive)\n\n\nasync def request_form_consumption(request: Request[State]) -> None:\n    awaited_form = await request.form()\n    assert_type(awaited_form, FormData)\n    reveal_type(awaited_form)\n    async with request.form() as context_form:\n        assert_type(context_form, FormData)\n        reveal_type(context_form)\n\n\nasync def request_stream_consumption(request: Request[State]) -> None:\n    async for chunk in request.stream():\n        assert_type(chunk, bytes)\n        reveal_type(chunk)\n\n\nasync def request_body_json_consumption(request: Request[State]) -> None:\n    body = await request.body()\n    assert_type(body, bytes)\n    reveal_type(body)\n    json_value = await request.json()\n    assert_type(json_value, Any)\n    reveal_type(json_value)\n\n\ndef request_parameters_consumption(request: Request[State]) -> None:\n    assert_type(request.query_params, QueryParams)\n    reveal_type(request.query_params)\n    assert_type(request.query_params[\"tag\"], str)\n    assert_type(request.query_params.getlist(\"tag\"), list[str])\n    assert_type(request.query_params.multi_items(), list[tuple[str, str]])\n    reveal_type(request.query_params[\"tag\"])\n    reveal_type(request.query_params.getlist(\"tag\"))\n    reveal_type(request.query_params.multi_items())\n    assert_type(request.path_params, dict[str, Any])\n    reveal_type(request.path_params)\n\n\nclass CustomRoute(BaseRoute):\n    path = \"/custom\"\n    name = \"custom\"\n    param_convertors: dict[str, Any] = {}\n    _uses_custom_convertors = False\n\n    def matches(self, scope: Scope) -> tuple[Match, Scope]:\n        return Match.NONE, {}\n\n    def url_path_for(self, name: str, /, **path_params: object) -> URLPath:\n        return URLPath(path=\"/custom\")\n\n    async def handle(self, scope: Scope, receive: Receive, send: Send) -> None:\n        return None\n\n\nasync def route_contract(\n    route: BaseRoute, scope: Scope, receive: Receive, send: Send\n) -> tuple[Match, Scope]:\n    match = route.matches(scope)\n    path = route.url_path_for(\"custom\")\n    handle_result = route.handle(scope, receive, send)\n    await handle_result\n    reveal_type(path)\n    return match\n\n\nasync def call_route_contract(\n    route: BaseRoute, scope: Scope, receive: Receive, send: Send\n) -> None:\n    await route(scope, receive, send)\n\n\n@asynccontextmanager\nasync def typed_lifespan(app: TypedApp) -> AsyncIterator[Mapping[str, object]]:\n    yield {\"user_id\": 1}\n\n\ndef mutate_scope(scope: Scope, app: ASGIApp) -> None:\n    scope[\"app\"] = app\n    scope[\"state\"] = {\"user_id\": 1}\n\n\napp = TypedApp(\n    exception_handlers={Exception: http_handler},\n    lifespan=typed_lifespan,\n)\napp.mount(\"/child\", child)\napp.add_exception_handler(Exception, http_handler)\n\nasync def receive_message() -> Message:\n    return {\"type\": \"http.disconnect\"}\n\n\nasync def send_message(message: Message) -> None:\n    return None\n\n\nscope: Scope = {}\nreceive: Receive = receive_message\nsend: Send = send_message\nhttp_connection = HTTPConnection(scope, receive)\nrequest = Request(scope, receive, send)\nwebsocket = WebSocket(scope, receive, send)\nclose = WebSocketClose()\nreveal_type(http_connection)\nreveal_type(http_connection.scope)\nreveal_type(request.cookies)\nreveal_type(request.stream())\nreveal_type(request.form())\nreveal_type(websocket.receive)\nreveal_type(websocket.send)\nreveal_type(close)\nmutate_scope(scope, app)\nreveal_type(Scope)\nreveal_type(app.build_middleware_stack())\nreveal_type(request_state)\nreveal_type(websocket_state)\nreveal_type(typed_lifespan)\n\n\nasync def public_scope_contract(\n    scope: UserDict[str, Any],\n    mutable_scope: MutableMapping[str, Any],\n    receive: Receive,\n    send: Send,\n    app: Starlette,\n    router: Router,\n    static_files: StaticFiles,\n    authentication: AuthenticationMiddleware,\n    base_http: BaseHTTPMiddleware,\n    body_limit: RequestBodyLimitMiddleware,\n    cors: CORSMiddleware,\n    gzip: GZipMiddleware,\n    https_redirect: HTTPSRedirectMiddleware,\n    sessions: SessionMiddleware,\n    trusted_host: TrustedHostMiddleware,\n    wsgi: WSGIMiddleware,\n) -> None:\n    await app(scope, receive, send)\n    await router(scope, receive, send)\n    await static_files(scope, receive, send)\n    await authentication(scope, receive, send)\n    await base_http(scope, receive, send)\n    await body_limit(scope, receive, send)\n    await cors(scope, receive, send)\n    await gzip(scope, receive, send)\n    await https_redirect(scope, receive, send)\n    await sessions(scope, receive, send)\n    await trusted_host(scope, receive, send)\n    await wsgi(scope, receive, send)\n    await app(mutable_scope, receive, send)\n    await router(mutable_scope, receive, send)\n    await static_files(mutable_scope, receive, send)\n    await authentication(mutable_scope, receive, send)\n    await base_http(mutable_scope, receive, send)\n    await body_limit(mutable_scope, receive, send)\n    await cors(mutable_scope, receive, send)\n    await gzip(mutable_scope, receive, send)\n    await https_redirect(mutable_scope, receive, send)\n    await sessions(mutable_scope, receive, send)\n    await trusted_host(mutable_scope, receive, send)\n    await wsgi(mutable_scope, receive, send)\n    URL(scope=scope)\n    URL(scope=mutable_scope)\n"
      },
