      "typing_consumer": {
        "source": "from collections import UserDict\nfrom typing import Any\n\nfrom starlette.responses import FileResponse, Response, StreamingResponse\nfrom starlette.types import Receive, Scope, Send\n\n\nasync def response_scope_contract(\n    response: Response,\n    streaming: StreamingResponse,\n    file_response: FileResponse,\n    scope: Scope,\n    receive: Receive,\n    send: Send,\n) -> None:\n    user_scope: UserDict[str, Any] = UserDict()\n    await response(user_scope, receive, send)\n    await streaming(user_scope, receive, send)\n    await file_response(user_scope, receive, send)\n    scope['app'] = response\n\n"
      }
