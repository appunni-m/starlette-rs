      "typing_consumer": {
        "source": "from collections import UserDict\nfrom datetime import datetime\nfrom typing import Any, Literal\n\nfrom typing_extensions import assert_type\n\nfrom starlette.datastructures import MutableHeaders\nfrom starlette.responses import FileResponse, Response, StreamingResponse\nfrom starlette.types import Receive, Scope, Send\n\n\nasync def response_scope_contract(\n    response: Response,\n    streaming: StreamingResponse,\n    file_response: FileResponse,\n    scope: Scope,\n    receive: Receive,\n    send: Send,\n) -> None:\n    user_scope: UserDict[str, Any] = UserDict()\n    await response(user_scope, receive, send)\n    await streaming(user_scope, receive, send)\n    await file_response(user_scope, receive, send)\n    scope['app'] = response\n\n\ndef response_headers_and_cookie_contract(\n    response: Response,\n    expires: datetime | str | int | None,\n    samesite: Literal['lax', 'strict', 'none'] | None,\n) -> None:\n    assert_type(response.headers, MutableHeaders)\n    assert_type(\n        response.set_cookie(\n            key='session',\n            value='token',\n            max_age=60,\n            expires=expires,\n            path=None,\n            domain='example.com',\n            secure=True,\n            httponly=True,\n            samesite=samesite,\n            partitioned=True,\n        ),\n        None,\n    )\n    response.set_cookie(key='session', samesite='invalid')\n\n"
      }
    }
